name: Deploy Application to S3

on:
  push:
    branches:
      - main # Triggers the pipeline when you push to main

permissions:
  id-token: write # Required for requesting the JWT OIDC token
  contents: read  # Required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::064318812275:role/github-albelb-insert
          aws-region: us-east-1 # Change to your preferred AWS region
          audience: sts.amazonaws.com

      - name: Sync Files to S3
        run: |
          aws s3 sync . s3://my-portfolio-scalability-app-code --exclude ".git*"